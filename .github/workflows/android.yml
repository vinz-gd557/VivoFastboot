name: Build VivoFastboot APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Show generated APKs
        if: always()
        run: |
          echo "=== DEBUG ==="
          find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name "*.apk" -print 2>/dev/null || true

          echo "=== RELEASE ==="
          find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name "*.apk" -print 2>/dev/null || true

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          RELEASE_APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name "*.apk" \
            | head -n 1)"

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK tidak ditemukan."
            exit 1
          fi

          echo "Release APK ditemukan:"
          echo "$RELEASE_APK"

          cp "$RELEASE_APK" dist/VivoFastboot-release.apk

          ls -lh dist/VivoFastboot-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VivoFastboot-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VivoFastboot-release
          path: dist/VivoFastboot-release.apk
          if-no-files-found: error
          retention-days: 14
